<div *ngIf="tasks$ | async as tasks; else noTasks">
  <div
    fxLayout="row wrap"
    fxLayoutAlign="space-evenly center"
    [fxLayoutGap]="20"
  >
    <div
      *ngFor="let task of tasks"
      fxFlex="23%"
      fxFlex.gt-sm="23%"
      fxFlex.md="23%"
    >
      <app-card [task]="task" (deleteTask)="handleDeleteTask($event)"></app-card>
    </div>
  </div>
</div>

<ng-template #noTasks>
  <p>No tasks available!</p>
</ng-template>
