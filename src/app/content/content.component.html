<div *ngIf="tasks && tasks.length > 0">
  <div
    fxLayout="row wrap"
    fxLayoutAlign="space-evenly center"
    [fxLayoutGap]="20"
  >
    <div
      *ngFor="let task of tasks"
      fxFlex="23%"
      fxFlex.gt-sm="23%"
      fxFlex.md="23%"
    >
      <app-card [task]="task"/>
    </div>
  </div>
</div>
