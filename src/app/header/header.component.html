<mat-tab-group (selectedTabChange)="tabChanged($event)">
  <mat-tab label="All"> 
    <div fxLayout="row" fxLayoutAlign="center center">
      <h4 fxFlex="67">All tasks</h4> 
      <app-btn [btnType]="'Create task'" [onClick]="createTaskHandler"/>
    </div>
  </mat-tab>
  <mat-tab label="Completed">Completed</mat-tab>
  <mat-tab label="Uncompleted">Uncompleted</mat-tab>
</mat-tab-group>
