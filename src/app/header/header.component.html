<mat-tab-group (selectedIndexChange)="onTabChange($event)">
  <mat-tab *ngFor="let tab of tabs" [label]="tab">
    <div fxLayout="row" fxLayoutAlign="center center">
      <h4 fxFlex="67">{{ tab }} tasks</h4>
      <app-btn [btnType]="'Create task'" [onClick]="createTaskHandler"></app-btn>
    </div>
    <app-content [selectedTab]="selectedTab"></app-content>
  </mat-tab>
</mat-tab-group>
